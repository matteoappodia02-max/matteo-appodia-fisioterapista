<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TITOLO SEO DINAMICO -->
    <title>{% if page.title %}{{ page.title }} • Dott. Matteo Appodia Fisioterapista{% else %}Fisioterapia a Domicilio Foligno, Spoleto, Assisi • Dott. Matteo Appodia{% endif %}</title>
    
    <!-- META DESCRIPTION PER GOOGLE -->
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Fisioterapia a domicilio a Foligno, Spoleto, Assisi e Bastia Umbra. Riabilitazione muscoloscheletrica, neurologica e post-operatoria basata sulle evidenze. Servizio HCP INPS.{% endif %}">
    <meta name="author" content="Matteo Appodia">
    <meta name="robots" content="index, follow">
    
    <!-- URL CANONICAL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- OPEN GRAPH -->
    <meta property="og:locale" content="it_IT">
    <meta property="og:type" content="{% if page.title %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Matteo Appodia • Fisioterapia a Domicilio Foligno e Spoleto{% endif %}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Fisioterapia e riabilitazione a domicilio nelle zone di Foligno, Spoleto, Assisi e Bastia Umbra.{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Matteo Appodia Fisioterapia">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
    {% endif %}

    <!-- LINK CSS AUTOMATICO CON relative_url -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- DATI STRUTTURATI GOOGLE SCHEMA.ORG -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Physiotherapist",
      "name": "Matteo Appodia Fisioterapia a Domicilio",
      "image": "{{ '/images/matteo-appodia.jpg' | absolute_url }}",
      "telephone": "+393703448214",
      "email": "matteo.appodia02@gmail.com",
      "vatID": "03975090543",
      "priceRange": "€€",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Foligno",
        "addressRegion": "PG",
        "addressCountry": "IT"
      },
      "areaServed": [
        { "@type": "City", "name": "Foligno" },
        { "@type": "City", "name": "Spoleto" },
        { "@type": "City", "name": "Assisi" },
        { "@type": "City", "name": "Bastia Umbra" }
      ],
      "medicalSpecialty": [
        "Musculoskeletal",
        "Neurologic",
        "Physiotherapy"
      ],
      "url": "{{ '/' | absolute_url }}"
    }
    </script>
</head>
<body>

    <!-- Header / Navigazione Principale -->
    <header>
        <div class="container nav-container">
            <div class="logo"><a href="{{ '/' | relative_url }}" style="text-decoration:none; color:inherit;">Matteo Appodia <span>Fisioterapia</span></a></div>
            <nav>
                <a href="{{ '/#su-di-me' | relative_url }}">Su di me</a>
                <a href="{{ '/#servizi' | relative_url }}">Servizi</a>
                <a href="{{ '/#hcp' | relative_url }}">HCP INPS</a>
                <a href="{{ '/#blog' | relative_url }}">Blog</a>
                <a href="{{ '/#contatti' | relative_url }}" class="btn-nav">Contatti</a>
            </nav>
        </div>
    </header>

    <!-- Contenuto della pagina o dell'articolo -->
    {{ content }}

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Matteo Appodia • Fisioterapia a Domicilio. P.IVA: 03975090543. Tutti i diritti riservati.</p>
        </div>
    </footer>

</body>
</html>
