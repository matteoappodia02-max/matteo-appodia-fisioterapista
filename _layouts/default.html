<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} • Matteo Appodia Fisioterapia{% else %}Matteo Appodia • Fisioterapia a Domicilio{% endif %}</title>
    <!-- Collegamento a style.css -->
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navigazione Principale -->
    <header>
        <div class="container nav-container">
            <div class="logo"><a href="{{ site.baseurl }}/" style="text-decoration:none; color:inherit;">Matteo Appodia <span>Fisioterapia</span></a></div>
            <nav>
                <a href="{{ site.baseurl }}/#su-di-me">Su di me</a>
                <a href="{{ site.baseurl }}/#servizi">Servizi</a>
                <a href="{{ site.baseurl }}/#hcp">HCP INPS</a>
                <a href="{{ site.baseurl }}/#blog">Blog</a>
                <a href="{{ site.baseurl }}/#contatti" class="btn-nav">Contatti</a>
            </nav>
        </div>
    </header>

    <!-- Layout per la lettura degli articoli del Blog -->
    <main class="post-page">
        <div class="post-container">
            <a href="{{ site.baseurl }}/#blog" class="btn-back"><i class="fas fa-arrow-left"></i> Torna al Blog</a>
            <article>
                <div class="post-header">
                    <h1>{{ page.title }}</h1>
                    <div class="post-meta">Pubblicato il {{ page.date | date: "%d/%m/%Y" }} • Dott. Matteo Appodia</div>
                </div>

                <div class="post-body">
                    {{ content }}
                </div>
            </article>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Matteo Appodia • Fisioterapia. P.IVA: 03975090543. Tutti i diritti riservati.</p>
        </div>
    </footer>

</body>
</html>
